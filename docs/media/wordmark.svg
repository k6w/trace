<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="Trace">
  <title>Trace</title>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .wm   { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
  </style>

  <!-- The mark is the product: four requests on a timeline. -->
  <rect x="0" y="18" width="84" height="84" fill="#F5CF3A"/>
  <rect x="14" y="34" width="56" height="8"  fill="#141414"/>
  <rect x="14" y="50" width="34" height="8"  fill="#141414"/>
  <rect x="14" y="66" width="48" height="8"  fill="#141414"/>
  <rect x="14" y="82" width="22" height="8"  fill="#141414"/>

  <text class="wm" x="106" y="86" font-size="56" letter-spacing="6" fill="#A9A9B4">TRACE</text>

  <!-- Spectrum rule under the wordmark, in request order. -->
  <g>
    <rect x="106" y="102" width="10"  height="5" fill="#6E6E78"/>
    <rect x="118" y="102" width="26"  height="5" fill="#3FBDDA"/>
    <rect x="146" y="102" width="44"  height="5" fill="#7C71EE"/>
    <rect x="192" y="102" width="52"  height="5" fill="#C173E6"/>
    <rect x="246" y="102" width="8"   height="5" fill="#F0913F"/>
    <rect x="256" y="102" width="118" height="5" fill="#F5CF3A"/>
    <rect x="376" y="102" width="22"  height="5" fill="#45CE93"/>
  </g>

  <text class="mono" x="416" y="107" font-size="11" letter-spacing="2" fill="#8A8A93">HAR READER</text>
</svg>
